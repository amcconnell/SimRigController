[project]
name = "shaker"
version = "0.0.1"
description = "Drives a bass shaker amp from Gran Turismo 7 PS5 telemetry."
requires-python = ">=3.11"
dependencies = [
    "pycryptodome>=3.20",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "watchfiles>=0.24",
    "numpy>=2.0",
    "sounddevice>=0.5",
    # I2C for the accelerometer pods. Pure Python and installs anywhere;
    # opening a bus is what fails off a Pi, and that is handled.
    "smbus2>=0.4",
    # GPIO for the status LED and the pods' interrupt lines. Pure Python over
    # /dev/gpiochip*, chosen for the same reason as smbus2: it installs
    # anywhere, and what fails off a Pi is opening the device rather than
    # installing the package. lgpio — what Raspberry Pi OS itself ships — is
    # distributed as source, so it wanted Python headers, SWIG and a -dev
    # package on the appliance to rebuild a module already present.
    "python-periphery>=2.4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "shaker"
module-root = "src"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
