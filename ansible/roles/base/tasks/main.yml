- name: Set timezone
  community.general.timezone:
    name: "{{ simrig_timezone | default('Etc/UTC') }}"
  when: simrig_timezone is defined

- name: Refresh apt cache (daily)
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 86400

- name: Install base system packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - rsync
      - tar
      - alsa-utils
      - libportaudio2
      # i2cdetect, for confirming a pod answers before blaming the software.
      - i2c-tools
    state: present

# --- I2C for the accelerometer pods ----------------------------------------
# Off by default on Raspberry Pi OS, and the failure is quiet: /dev/i2c-1 simply
# does not exist, which the app reports as "bus unavailable" rather than
# crashing. Enabling it here means a pod works the first time it is plugged in
# instead of after a debugging session.

- name: Enable the I2C controller in boot config
  ansible.builtin.lineinfile:
    # Bookworm moved this from /boot; the old path is a symlink on current
    # images but not on every one, so target the real location.
    path: /boot/firmware/config.txt
    regexp: '^#?\s*dtparam=i2c_arm='
    line: "dtparam=i2c_arm=on"
    state: present
  register: i2c_boot_config
  notify: Reboot for I2C

- name: Run the I2C bus at 400 kHz
  # The Pi defaults to 100 kHz, where the bus cannot keep up. A 6-byte block
  # read is ~0.81 ms at 100 kHz, so draining two 32-deep FIFOs costs ~52 ms
  # against a 20 ms poll — samples are lost with no error anywhere, which is
  # the failure mode most likely to be blamed on the mounting. At 400 kHz the
  # same work is ~13 ms and fits. 400 kHz is also what the ADXL345 datasheet
  # assumes when it caps I2C output at 800 Hz.
  ansible.builtin.lineinfile:
    path: /boot/firmware/config.txt
    regexp: '^#?\s*dtparam=i2c_arm_baudrate='
    line: "dtparam=i2c_arm_baudrate=400000"
    state: present
  notify: Reboot for I2C

- name: Load the i2c-dev module at boot
  ansible.builtin.lineinfile:
    path: /etc/modules-load.d/simrig-i2c.conf
    line: "i2c-dev"
    create: true
    owner: root
    group: root
    mode: "0644"
  notify: Reboot for I2C

- name: Load i2c-dev now, so a reboot is only needed for the boot-config change
  community.general.modprobe:
    name: i2c-dev
    state: present
  failed_when: false

- name: Ensure parent app directory exists
  ansible.builtin.file:
    path: /opt/simrig
    state: directory
    owner: root
    group: root
    mode: "0755"
